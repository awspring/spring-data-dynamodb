name: Release

on:
  push:
    tags:
      - v1.0.*
      - v1.1.*
      - v1.2.*

env:
  # https://github.com/actions/checkout/issues/440#issuecomment-854240996
  AWS_EC2_METADATA_DISABLED: true

permissions:
  contents: read

jobs:
  build:
    name: Release
    strategy:
      matrix:
        version: [ 17.0.12 ]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.version }}
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
      - name: Import GPG key
        run: gpg --batch --import <(echo "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}")
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Run tests
        run: ./mvnw -V verify javadoc:aggregate -Pdocs-classic -pl '!spring-data-dynamodb-examples'
      - name: Deploy to Sonatype
        run: ./mvnw -V -Prelease deploy -DskipTests -pl '!spring-data-dynamodb-examples'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_AWS_SECRET_KEY }}
        run: |
          aws s3 sync --acl public-read docs/target/generated-docs/ s3://awspring-docs/spring-data-dynamodb/docs/
          aws s3 sync --acl public-read target/site/ s3://awspring-docs/spring-data-dynamodb/docs/
          aws cloudfront create-invalidation --distribution-id EA7LER7CI960A --paths "/*"
